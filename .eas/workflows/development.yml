name: Development

on:
  push:
    branches:
      - development

jobs:
  lint:
    name: Lint
    type: custom
    steps:
      - uses: eas/checkout

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  test:
    name: Tests
    type: custom
    steps:
      - uses: eas/checkout

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --runInBand --passWithNoTests # Remove once tests are added
